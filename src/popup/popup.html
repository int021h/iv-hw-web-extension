<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Warden</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Шапка с брендингом -->
  <header class="brand">
    <img class="brand-logo" src="../../icons/icon-128.png" alt="Warden">
    <div class="brand-text">
      <div class="brand-name">Warden</div>
      <div class="brand-tagline">аналитика гильдии Hero Wars</div>
    </div>
  </header>

  <!-- Карточка игрока -->
  <div class="card" id="playerCard">
    <div class="avatar" id="avatar" data-role="MEMBER">?</div>
    <div class="info">
      <div class="name-row">
        <span class="name" id="name">—</span>
        <span class="owner-badge" id="ownerBadge" hidden>👑</span>
      </div>
      <div class="meta-row">
        <span class="guild" id="guild">—</span>
        <span class="role-badge" id="roleBadge" data-role="MEMBER">—</span>
      </div>
    </div>
  </div>

  <!-- Статус подключения -->
  <div class="status" id="status" data-state="idle">
    <span class="status-dot"></span>
    <span class="status-text" id="statusText">Ожидание данных из игры…</span>
  </div>

  <!-- Краткая статистика -->
  <div class="stats">
    <div class="stat"><span>В очереди</span><b id="queueSize">0</b></div>
    <div class="stat"><span>Последний ивент</span><b id="lastCapture">—</b></div>
    <div class="stat"><span>Последняя отправка</span><b id="lastSync">—</b></div>
    <div class="stat"><span>Всего отправлено</span><b id="totalSent">0</b></div>
    <div class="stat stat-error" id="failedRow" hidden><span>Ошибок в последнем батче</span><b id="lastFailed">0</b></div>
  </div>

  <div class="footer">
    <span id="backend">warden-api.pankov.dev</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
